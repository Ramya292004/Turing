<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./talent1.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stlyesheet">
    <title>Sign up</title>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./main logo.jpg" alt="Turing">
        </div>
        <div class="talent">
        <div class="signin">
           <h3>Create an account</h3>
           <p class="para"> Get started with email or Google</p>
           <button class="btn">
                 <img src="./google.jpg" alt="google" class="google">
                 <p class="para1">
                  <a href="https://accounts.google.com/AccountChooser" target="_blank">
                     Sign up with Google
                  </a></p>
           </button>
           <p class="para2">______________Or continue with email_____________</p>
           
           <label>Email</label>
           <input type="text" placeholder="name@example.com">
           <label>Password</label>
           <!-- <span class="forgot">Forgot Your Password?</span> -->
           <input type="password">
           <button class="black">Sign up</button>

           <p class="para3">Already have an account?<a href="#">Sign in</a></p>
           </div>
        </div>
    </div>
    <p class="footer">By continuing, you agree to our <span class="terms"><a href="https://www.turing.com/terms-of-service">Terms of Service</a></span> and   <span class="policy"><a href="https://www.turing.com/policy">Privacy<br> Policy</a></span></p>  
</body>
</html>
